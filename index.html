<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>План на неделю</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3b3a42;
      --muted: #74717d;
      --line: rgba(82, 78, 93, 0.14);
      --paper: rgba(255, 255, 255, 0.76);
      --paper-strong: rgba(255, 255, 255, 0.92);
      --mint: #cfe9de;
      --peach: #f7d8c7;
      --lavender: #ddd6f2;
      --sky: #cfe3f1;
      --rose: #f1d4dd;
      --butter: #f5e8bd;
      --sage: #dce8ca;
      --focus: #796cbe;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(207, 233, 222, 0.9), transparent 28rem),
        radial-gradient(circle at 88% 18%, rgba(247, 216, 199, 0.85), transparent 24rem),
        linear-gradient(135deg, #fbf8f2 0%, #eef6f1 46%, #f7f0f4 100%);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 44px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .summary {
      min-width: 190px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(82, 78, 93, 0.1);
    }

    .summary strong {
      display: block;
      font-size: 2rem;
      line-height: 1;
    }

    .summary span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .add-panel {
      display: grid;
      grid-template-columns: minmax(130px, 180px) minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper-strong);
      box-shadow: 0 14px 42px rgba(82, 78, 93, 0.08);
    }

    select,
    input[type="text"] {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      outline: none;
    }

    select {
      padding: 0 12px;
    }

    input[type="text"] {
      padding: 0 14px;
    }

    select:focus,
    input[type="text"]:focus {
      border-color: rgba(121, 108, 190, 0.55);
      box-shadow: 0 0 0 4px rgba(121, 108, 190, 0.12);
    }

    .add-btn,
    .icon-btn {
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #6f8f7f;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .add-btn {
      min-width: 128px;
      height: 44px;
      padding: 0 18px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(99, 129, 113, 0.24);
    }

    .add-btn:hover,
    .icon-btn:hover {
      transform: translateY(-1px);
      background: #637f73;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, minmax(150px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .day {
      min-height: 360px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 16px 44px rgba(82, 78, 93, 0.09);
      backdrop-filter: blur(16px);
    }

    .day:nth-child(1) { --accent: var(--mint); }
    .day:nth-child(2) { --accent: var(--peach); }
    .day:nth-child(3) { --accent: var(--lavender); }
    .day:nth-child(4) { --accent: var(--sky); }
    .day:nth-child(5) { --accent: var(--rose); }
    .day:nth-child(6) { --accent: var(--butter); }
    .day:nth-child(7) { --accent: var(--sage); }

    .day-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .day-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      margin: 0;
      font-size: 1rem;
    }

    .mark {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.7);
    }

    .count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .tasks {
      display: grid;
      gap: 9px;
      min-height: 272px;
      align-content: start;
    }

    .task {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 28px;
      gap: 8px;
      align-items: center;
      min-height: 46px;
      padding: 8px;
      border: 1px solid rgba(82, 78, 93, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
    }

    .task input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .check {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(82, 78, 93, 0.18);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .check svg,
    .delete svg {
      width: 16px;
      height: 16px;
    }

    .check svg {
      opacity: 0;
      stroke: #4f7462;
      stroke-width: 3;
    }

    .task.done {
      background: color-mix(in srgb, var(--accent) 34%, white);
    }

    .task.done .check {
      border-color: transparent;
      background: white;
    }

    .task.done .check svg {
      opacity: 1;
    }

    .task.done .text {
      color: rgba(59, 58, 66, 0.58);
      text-decoration: line-through;
    }

    .text {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .delete {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      color: #8b7d83;
      background: transparent;
      cursor: pointer;
    }

    .delete:hover {
      color: #533f48;
      background: rgba(255, 255, 255, 0.72);
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 92px;
      padding: 14px;
      border: 1px dashed rgba(82, 78, 93, 0.18);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 980px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .summary {
        min-width: 0;
      }

      .week {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 520px);
        padding-top: 22px;
      }

      .add-panel,
      .week {
        grid-template-columns: 1fr;
      }

      .add-btn {
        width: 100%;
      }

      .day {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>План на неделю</h1>
        <p class="subtitle">Добавляй задачи по дням и отмечай готовое. Список сохраняется в этом браузере автоматически.</p>
      </div>
      <div class="summary" aria-live="polite">
        <strong id="progressNumber">0/0</strong>
        <span id="progressText">Пока нет задач</span>
      </div>
    </header>

    <form class="add-panel" id="taskForm">
      <select id="daySelect" aria-label="День недели"></select>
      <input id="taskInput" type="text" autocomplete="off" maxlength="120" placeholder="Новая задача">
      <button class="add-btn" type="submit">Добавить</button>
    </form>

    <section class="week" id="week" aria-label="Задачи на неделю"></section>
  </main>

  <template id="taskTemplate">
    <article class="task">
      <label class="check" title="Отметить выполнение">
        <input type="checkbox">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12.5l4.2 4.1L19 7"></path>
        </svg>
      </label>
      <span class="text"></span>
      <button class="delete" type="button" title="Удалить задачу" aria-label="Удалить задачу">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M6 7l1 13h10l1-13"></path>
          <path d="M9 7V4h6v3"></path>
        </svg>
      </button>
    </article>
  </template>

  <script>
    const days = [
      "Понедельник",
      "Вторник",
      "Среда",
      "Четверг",
      "Пятница",
      "Суббота",
      "Воскресенье"
    ];

    const storageKey = "soft-week-todo-v1";
    const week = document.querySelector("#week");
    const form = document.querySelector("#taskForm");
    const daySelect = document.querySelector("#daySelect");
    const taskInput = document.querySelector("#taskInput");
    const progressNumber = document.querySelector("#progressNumber");
    const progressText = document.querySelector("#progressText");
    const template = document.querySelector("#taskTemplate");

    let tasks = loadTasks();

    days.forEach((day, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = day;
      daySelect.append(option);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = taskInput.value.trim();

      if (!title) {
        taskInput.focus();
        return;
      }

      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        day: Number(daySelect.value),
        title,
        done: false
      });

      taskInput.value = "";
      taskInput.focus();
      saveAndRender();
    });

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
      } catch {
        return [];
      }
    }

    function saveAndRender() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
      render();
    }

    function render() {
      week.replaceChildren();

      days.forEach((day, index) => {
        const dayTasks = tasks.filter((task) => task.day === index);
        const doneCount = dayTasks.filter((task) => task.done).length;
        const section = document.createElement("section");
        section.className = "day";
        section.innerHTML = `
          <div class="day-head">
            <h2 class="day-title"><span class="mark"></span><span>${day}</span></h2>
            <span class="count">${doneCount}/${dayTasks.length}</span>
          </div>
          <div class="tasks"></div>
        `;

        const list = section.querySelector(".tasks");

        if (dayTasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Свободный день";
          list.append(empty);
        } else {
          dayTasks.forEach((task) => list.append(createTask(task)));
        }

        week.append(section);
      });

      renderProgress();
    }

    function createTask(task) {
      const node = template.content.firstElementChild.cloneNode(true);
      const checkbox = node.querySelector("input");
      const text = node.querySelector(".text");
      const removeButton = node.querySelector(".delete");

      node.classList.toggle("done", task.done);
      checkbox.checked = task.done;
      text.textContent = task.title;

      checkbox.addEventListener("change", () => {
        tasks = tasks.map((item) => item.id === task.id ? { ...item, done: checkbox.checked } : item);
        saveAndRender();
      });

      removeButton.addEventListener("click", () => {
        tasks = tasks.filter((item) => item.id !== task.id);
        saveAndRender();
      });

      return node;
    }

    function renderProgress() {
      const total = tasks.length;
      const done = tasks.filter((task) => task.done).length;
      progressNumber.textContent = `${done}/${total}`;
      progressText.textContent = total === 0
        ? "Пока нет задач"
        : `Выполнено ${Math.round((done / total) * 100)}%`;
    }

    render();
  </script>
</body>
</html>
