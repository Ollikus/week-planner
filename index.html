<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>План на неделю</title>
  <script>
    // Применяем сохранённую тему до отрисовки, чтобы не было мигания
    try {
      const t = localStorage.getItem("soft-week-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #3b3a42;
      --muted: #74717d;
      --line: rgba(82, 78, 93, 0.14);
      --paper: rgba(255, 255, 255, 0.76);
      --paper-strong: rgba(255, 255, 255, 0.92);
      --mint: #cfe9de;
      --peach: #f7d8c7;
      --lavender: #ddd6f2;
      --sky: #cfe3f1;
      --rose: #f1d4dd;
      --butter: #f5e8bd;
      --sage: #dce8ca;
      --focus: #796cbe;
      --check-bg: #ffffff;
      --check-stroke: #4f7462;
      --done-base: #ffffff;
      --radius: 0.5rem;
      --gap: clamp(0.625rem, 1.6cqi, 0.9rem);
      --control: clamp(2.75rem, 5.6cqi, 3.25rem);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e9e7f0;
      --muted: #a6a2b3;
      --line: rgba(255, 255, 255, 0.12);
      --paper: rgba(42, 40, 52, 0.72);
      --paper-strong: rgba(48, 46, 60, 0.92);
      --mint: #7fae9b;
      --peach: #d6a585;
      --lavender: #a59ccf;
      --sky: #8fb3cf;
      --rose: #cf9aae;
      --butter: #cdbb7d;
      --sage: #a6b98a;
      --focus: #9d90e0;
      --check-bg: rgba(255, 255, 255, 0.1);
      --check-stroke: #bfe6d3;
      --done-base: #2a2834;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(207, 233, 222, 0.9), transparent 28rem),
        radial-gradient(circle at 88% 18%, rgba(247, 216, 199, 0.85), transparent 24rem),
        linear-gradient(135deg, #fbf8f2 0%, #eef6f1 46%, #f7f0f4 100%);
      transition: background 240ms ease, color 240ms ease;
    }

    :root[data-theme="dark"] body {
      background:
        radial-gradient(circle at 15% 12%, rgba(127, 174, 155, 0.16), transparent 28rem),
        radial-gradient(circle at 88% 18%, rgba(214, 165, 133, 0.14), transparent 24rem),
        linear-gradient(135deg, #1c1b22 0%, #1f242a 46%, #221d28 100%);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      container-type: inline-size;
      width: min(73.75rem, calc(100% - clamp(1.25rem, 4cqi, 2rem)));
      margin: 0 auto;
      padding: clamp(1.375rem, 4.4cqi, 2.25rem) 0 clamp(2rem, 5cqi, 2.875rem);
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: clamp(1rem, 2.5cqi, 1.5rem);
      align-items: flex-end;
      margin-bottom: clamp(1.125rem, 3cqi, 1.625rem);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.2rem, 8cqi, 4.6rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 40rem;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.7cqi, 1.05rem);
      line-height: 1.5;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-width: min(100%, 15rem);
    }

    .summary {
      padding: clamp(0.875rem, 2cqi, 1.125rem);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      backdrop-filter: blur(1.125rem);
      box-shadow: 0 1.125rem 3rem rgba(82, 78, 93, 0.1);
    }

    .summary strong {
      display: block;
      font-size: clamp(1.75rem, 4cqi, 2.25rem);
      line-height: 1;
    }

    .summary span {
      display: block;
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: clamp(0.85rem, 1.4cqi, 0.95rem);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
    }

    .ghost-btn {
      flex: 1 1 auto;
      height: var(--control);
      padding: 0 clamp(0.85rem, 1.8cqi, 1.1rem);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
      font-size: clamp(0.82rem, 1.4cqi, 0.92rem);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .ghost-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(121, 108, 190, 0.45);
      background: var(--paper-strong);
    }

    .add-panel {
      display: grid;
      grid-template-columns: minmax(8.125rem, 11.25rem) minmax(0, 1fr) auto;
      gap: var(--gap);
      margin-bottom: clamp(0.875rem, 2.4cqi, 1.25rem);
      padding: clamp(0.625rem, 1.7cqi, 0.875rem);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-strong);
      box-shadow: 0 0.875rem 2.625rem rgba(82, 78, 93, 0.08);
    }

    select,
    input[type="text"] {
      width: 100%;
      height: var(--control);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      outline: none;
      font-size: clamp(0.95rem, 1.6cqi, 1rem);
    }

    :root[data-theme="dark"] select,
    :root[data-theme="dark"] input[type="text"] {
      background: rgba(255, 255, 255, 0.06);
    }

    select {
      padding: 0 clamp(0.7rem, 1.5cqi, 0.9rem);
    }

    input[type="text"] {
      padding: 0 clamp(0.75rem, 1.8cqi, 1rem);
    }

    select:focus,
    input[type="text"]:focus {
      border-color: rgba(121, 108, 190, 0.55);
      box-shadow: 0 0 0 0.25rem rgba(121, 108, 190, 0.12);
    }

    .add-btn {
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: var(--radius);
      color: white;
      background: #6f8f7f;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      min-width: min(100%, 8rem);
      height: var(--control);
      padding: 0 clamp(1rem, 2cqi, 1.25rem);
      font-weight: 700;
      font-size: clamp(0.95rem, 1.6cqi, 1rem);
      box-shadow: 0 0.625rem 1.5rem rgba(99, 129, 113, 0.24);
    }

    .add-btn:hover {
      transform: translateY(-1px);
      background: #637f73;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.75rem), 1fr));
      gap: var(--gap);
      align-items: start;
    }

    .day {
      min-height: clamp(18rem, 32cqi, 22.5rem);
      padding: clamp(0.75rem, 1.8cqi, 1rem);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 1rem 2.75rem rgba(82, 78, 93, 0.09);
      backdrop-filter: blur(1rem);
    }

    .day:nth-child(1) { --accent: var(--mint); }
    .day:nth-child(2) { --accent: var(--peach); }
    .day:nth-child(3) { --accent: var(--lavender); }
    .day:nth-child(4) { --accent: var(--sky); }
    .day:nth-child(5) { --accent: var(--rose); }
    .day:nth-child(6) { --accent: var(--butter); }
    .day:nth-child(7) { --accent: var(--sage); }

    .day.today {
      border-color: color-mix(in srgb, var(--accent) 65%, var(--line));
      box-shadow:
        0 0 0 0.14rem color-mix(in srgb, var(--accent) 60%, transparent),
        0 1rem 2.75rem rgba(82, 78, 93, 0.09);
    }

    .day-head {
      display: flex;
      justify-content: space-between;
      gap: 0.625rem;
      align-items: center;
      margin-bottom: clamp(0.625rem, 1.5cqi, 0.875rem);
      padding-bottom: clamp(0.625rem, 1.5cqi, 0.875rem);
      border-bottom: 1px solid var(--line);
    }

    .day-title {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      min-width: 0;
      margin: 0;
      font-size: clamp(0.98rem, 1.65cqi, 1.1rem);
    }

    .mark {
      width: clamp(0.75rem, 1.4cqi, 0.9rem);
      height: clamp(0.75rem, 1.4cqi, 0.9rem);
      flex: 0 0 auto;
      align-self: center;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 0.31rem rgba(255, 255, 255, 0.7);
    }

    :root[data-theme="dark"] .mark {
      box-shadow: 0 0 0 0.31rem rgba(255, 255, 255, 0.08);
    }

    .day-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-date {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: clamp(0.76rem, 1.3cqi, 0.86rem);
      font-weight: 500;
    }

    .day.today .day-date {
      color: color-mix(in srgb, var(--ink) 70%, var(--accent));
      font-weight: 700;
    }

    .day-tools {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 0 0 auto;
    }

    .count {
      color: var(--muted);
      font-size: clamp(0.8rem, 1.3cqi, 0.9rem);
    }

    .move {
      display: grid;
      place-items: center;
      width: clamp(1.6rem, 3cqi, 1.85rem);
      height: clamp(1.6rem, 3cqi, 1.85rem);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .move:hover {
      transform: translateY(-1px);
      color: var(--ink);
      background: var(--paper-strong);
      border-color: rgba(121, 108, 190, 0.4);
    }

    .move svg {
      width: 1rem;
      height: 1rem;
    }

    .tasks {
      display: grid;
      gap: clamp(0.5rem, 1.2cqi, 0.7rem);
      min-height: clamp(13rem, 25cqi, 17rem);
      align-content: start;
    }

    .task {
      display: grid;
      grid-template-columns: var(--task-button) minmax(0, 1fr) var(--task-button);
      gap: clamp(0.45rem, 1.1cqi, 0.65rem);
      align-items: center;
      min-height: clamp(2.75rem, 5.2cqi, 3.25rem);
      padding: clamp(0.45rem, 1.1cqi, 0.65rem);
      border: 1px solid rgba(82, 78, 93, 0.1);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      --task-button: clamp(1.75rem, 3.4cqi, 2rem);
    }

    :root[data-theme="dark"] .task {
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
    }

    .task input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .check {
      display: grid;
      place-items: center;
      width: var(--task-button);
      height: var(--task-button);
      border: 1px solid rgba(82, 78, 93, 0.18);
      border-radius: 999px;
      background: var(--check-bg);
      cursor: pointer;
    }

    :root[data-theme="dark"] .check {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .check svg,
    .delete svg {
      width: clamp(0.95rem, 1.8cqi, 1.1rem);
      height: clamp(0.95rem, 1.8cqi, 1.1rem);
    }

    .check svg {
      opacity: 0;
      stroke: var(--check-stroke);
      stroke-width: 3;
    }

    .task.done {
      background: color-mix(in srgb, var(--accent) 34%, var(--done-base));
    }

    .task.done .check {
      border-color: transparent;
      background: var(--check-bg);
    }

    .task.done .check svg {
      opacity: 1;
    }

    .task.done .text {
      color: color-mix(in srgb, var(--ink) 55%, transparent);
      text-decoration: line-through;
    }

    .text {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: clamp(0.92rem, 1.55cqi, 1rem);
      line-height: 1.35;
    }

    .delete {
      display: grid;
      place-items: center;
      width: var(--task-button);
      height: var(--task-button);
      border: 0;
      border-radius: var(--radius);
      color: #8b7d83;
      background: transparent;
      cursor: pointer;
    }

    .delete:hover {
      color: #533f48;
      background: rgba(255, 255, 255, 0.72);
    }

    :root[data-theme="dark"] .delete {
      color: #b6a8af;
    }

    :root[data-theme="dark"] .delete:hover {
      color: #f0dde4;
      background: rgba(255, 255, 255, 0.08);
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: clamp(5rem, 10cqi, 6.25rem);
      padding: clamp(0.75rem, 1.8cqi, 1rem);
      border: 1px dashed rgba(82, 78, 93, 0.18);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: clamp(0.86rem, 1.45cqi, 0.95rem);
    }

    :root[data-theme="dark"] .empty {
      border-color: rgba(255, 255, 255, 0.16);
    }

    @media (max-width: 61.25rem) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .panel {
        min-width: 0;
      }
    }

    @media (max-width: 40rem) {
      .app {
        width: min(100% - 1.25rem, 32.5rem);
        padding-top: 1.375rem;
      }

      .add-panel,
      .week {
        grid-template-columns: 1fr;
      }

      .add-btn {
        width: 100%;
      }

      .day {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>План на неделю</h1>
        <p class="subtitle">Добавляй задачи по дням и отмечай готовое. Список сохраняется в этом браузере автоматически.</p>
      </div>
      <div class="panel">
        <div class="summary" aria-live="polite">
          <strong id="progressNumber">0/0</strong>
          <span id="progressText">Пока нет задач</span>
        </div>
        <div class="toolbar">
          <button class="ghost-btn" id="themeToggle" type="button">🌙 Тёмная тема</button>
          <button class="ghost-btn" id="clearDone" type="button">Очистить выполненные</button>
          <button class="ghost-btn" id="clearWeek" type="button">Очистить неделю</button>
        </div>
      </div>
    </header>

    <form class="add-panel" id="taskForm">
      <select id="daySelect" aria-label="День недели"></select>
      <input id="taskInput" type="text" autocomplete="off" maxlength="120" placeholder="Новая задача">
      <button class="add-btn" type="submit">Добавить</button>
    </form>

    <section class="week" id="week" aria-label="Задачи на неделю"></section>
  </main>

  <template id="taskTemplate">
    <article class="task">
      <label class="check" title="Отметить выполнение">
        <input type="checkbox">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12.5l4.2 4.1L19 7"></path>
        </svg>
      </label>
      <span class="text"></span>
      <button class="delete" type="button" title="Удалить задачу" aria-label="Удалить задачу">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M6 7l1 13h10l1-13"></path>
          <path d="M9 7V4h6v3"></path>
        </svg>
      </button>
    </article>
  </template>

  <script>
    const days = [
      "Понедельник",
      "Вторник",
      "Среда",
      "Четверг",
      "Пятница",
      "Суббота",
      "Воскресенье"
    ];

    const storageKey = "soft-week-todo-v1";
    const themeKey = "soft-week-theme";

    const week = document.querySelector("#week");
    const form = document.querySelector("#taskForm");
    const daySelect = document.querySelector("#daySelect");
    const taskInput = document.querySelector("#taskInput");
    const progressNumber = document.querySelector("#progressNumber");
    const progressText = document.querySelector("#progressText");
    const template = document.querySelector("#taskTemplate");
    const themeToggle = document.querySelector("#themeToggle");
    const clearDoneBtn = document.querySelector("#clearDone");
    const clearWeekBtn = document.querySelector("#clearWeek");

    let tasks = loadTasks();

    days.forEach((day, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = day;
      daySelect.append(option);
    });

    // По умолчанию выбираем сегодняшний день
    daySelect.value = String(todayIndex());

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = taskInput.value.trim();

      if (!title) {
        taskInput.focus();
        return;
      }

      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
        day: Number(daySelect.value),
        title,
        done: false
      });

      taskInput.value = "";
      taskInput.focus();
      saveAndRender();
    });

    clearDoneBtn.addEventListener("click", () => {
      const doneCount = tasks.filter((task) => task.done).length;
      if (doneCount === 0) return;
      if (!confirm(`Удалить выполненные задачи (${doneCount})?`)) return;
      tasks = tasks.filter((task) => !task.done);
      saveAndRender();
    });

    clearWeekBtn.addEventListener("click", () => {
      if (tasks.length === 0) return;
      if (!confirm("Удалить все задачи недели? Это действие необратимо.")) return;
      tasks = [];
      saveAndRender();
    });

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
    });

    applyTheme(document.documentElement.dataset.theme || localStorage.getItem(themeKey) || "light");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeToggle.textContent = theme === "dark" ? "☀️ Светлая тема" : "🌙 Тёмная тема";
      try {
        localStorage.setItem(themeKey, theme);
      } catch {}
    }

    function todayIndex() {
      return (new Date().getDay() + 6) % 7;
    }

    function dateForIndex(index) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - todayIndex() + index);
      return d;
    }

    function formatDate(d) {
      return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    }

    function moveIncomplete(index) {
      const next = (index + 1) % 7;
      tasks = tasks.map((task) =>
        task.day === index && !task.done ? { ...task, day: next } : task
      );
      saveAndRender();
    }

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
      } catch {
        return [];
      }
    }

    function saveAndRender() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
      render();
    }

    function render() {
      week.replaceChildren();
      const today = todayIndex();

      days.forEach((day, index) => {
        const dayTasks = tasks.filter((task) => task.day === index);
        const doneCount = dayTasks.filter((task) => task.done).length;
        const pending = dayTasks.length - doneCount;
        const nextDay = days[(index + 1) % 7];

        const section = document.createElement("section");
        section.className = index === today ? "day today" : "day";
        section.innerHTML = `
          <div class="day-head">
            <h2 class="day-title">
              <span class="mark"></span>
              <span class="day-name">${day}</span>
              <span class="day-date">${formatDate(dateForIndex(index))}</span>
            </h2>
            <div class="day-tools">
              ${pending > 0 ? `
                <button class="move" type="button" title="Перенести невыполненное на ${nextDay}" aria-label="Перенести невыполненное на ${nextDay}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14"></path>
                    <path d="M13 6l6 6-6 6"></path>
                  </svg>
                </button>
              ` : ""}
              <span class="count">${doneCount}/${dayTasks.length}</span>
            </div>
          </div>
          <div class="tasks"></div>
        `;

        const moveButton = section.querySelector(".move");
        if (moveButton) {
          moveButton.addEventListener("click", () => moveIncomplete(index));
        }

        const list = section.querySelector(".tasks");

        if (dayTasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Свободный день";
          list.append(empty);
        } else {
          dayTasks.forEach((task) => list.append(createTask(task)));
        }

        week.append(section);
      });

      renderProgress();
    }

    function createTask(task) {
      const node = template.content.firstElementChild.cloneNode(true);
      const checkbox = node.querySelector("input");
      const text = node.querySelector(".text");
      const removeButton = node.querySelector(".delete");

      node.classList.toggle("done", task.done);
      checkbox.checked = task.done;
      text.textContent = task.title;

      checkbox.addEventListener("change", () => {
        tasks = tasks.map((item) => item.id === task.id ? { ...item, done: checkbox.checked } : item);
        saveAndRender();
      });

      removeButton.addEventListener("click", () => {
        tasks = tasks.filter((item) => item.id !== task.id);
        saveAndRender();
      });

      return node;
    }

    function renderProgress() {
      const total = tasks.length;
      const done = tasks.filter((task) => task.done).length;
      progressNumber.textContent = `${done}/${total}`;
      progressText.textContent = total === 0
        ? "Пока нет задач"
        : `Выполнено ${Math.round((done / total) * 100)}%`;
    }

    render();
  </script>
</body>
</html>
