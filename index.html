    // Применяем сохранённую тему до отрисовки, чтобы не было мигания

      if (t) document.documentElement.dataset.theme = t;

    .habit-h {

    .chip b {

      display: grid;
      place-items: center;
      width: 1.05rem;
      height: 1.05rem;

    // ── даты ────────────────────────────────────────────────────────────

    function toISO(d) {
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }

    function fromISO(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(iso, n) {
      const d = fromISO(iso);
      d.setDate(d.getDate() + n);
      return toISO(d);
    }

    function mondayISO(date) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return toISO(d);
    }

    }

    function selectableDates(weeks = 5) {
      return Array.from({ length: weeks * 7 }, (_, i) => addDays(weekStart, i));
    }

    function fmtShort(iso) {
      return fromISO(iso).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    }

    function fmtLong(iso, withYear) {
      const opts = { day: "numeric", month: "long" };
      if (withYear) opts.year = "numeric";
      return fromISO(iso).toLocaleDateString("ru-RU", opts);
    }

    // ── хранилище ───────────────────────────────────────────────────────

    function loadJSON(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    function loadList(key) {
      const value = loadJSON(key, []);
      return Array.isArray(value) ? value : [];
    }

    function loadMap(key) {
      const value = loadJSON(key, {});
      return value && typeof value === "object" && !Array.isArray(value) ? value : {};
    }

    function save(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function makeId() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
    }

    // Однократный перенос данных из старого формата (день недели 0–6 → дата)
    function migrate() {
      const monday = mondayISO(new Date());
      const dates = dayNames.map((_, i) => addDays(monday, i));
      const clampDay = (day) => Math.min(Math.max(Number(day) || 0, 0), 6);

      if (localStorage.getItem(STORE.tasks) === null && localStorage.getItem(LEGACY.tasks) !== null) {
        const old = loadList(LEGACY.tasks).filter((t) => t && typeof t.title === "string");
        save(STORE.tasks, old.map((t) => ({
          id: t.id || makeId(),
          date: dates[clampDay(t.day)],
          title: t.title,
          done: Boolean(t.done)
        })));
      }

      if (localStorage.getItem(STORE.habits) === null && localStorage.getItem(LEGACY.habits) !== null) {
        const old = loadList(LEGACY.habits).filter((h) => h && typeof h.title === "string");
        save(STORE.habits, old.map((h) => {
          const marks = {};
          dates.forEach((date, i) => {
            if (h.days && h.days[i]) marks[date] = true;
          });
          return { id: h.id || makeId(), title: h.title, marks };
        }));
      }

      if (localStorage.getItem(STORE.prios) === null && localStorage.getItem(LEGACY.prios) !== null) {
        const old = loadJSON(LEGACY.prios, []);
        const map = {};
        if (Array.isArray(old)) {
          dates.forEach((date, i) => {
            const row = Array.isArray(old[i]) ? old[i].filter((s) => typeof s === "string" && s.trim() !== "") : [];
            if (row.length) map[date] = row.slice(0, 3);
          });
        }
        save(STORE.prios, map);
      }

      if (localStorage.getItem(STORE.notes) === null && localStorage.getItem(LEGACY.notes) !== null) {
        const old = loadJSON(LEGACY.notes, {});
        if (old && typeof old === "object" && !Array.isArray(old)) {
          save(STORE.notes, { [monday]: old });
        }
      }
    }

    migrate();

    let weekStart = mondayISO(new Date());
    let tasks = loadList(STORE.tasks).filter((t) => t && typeof t.title === "string" && typeof t.date === "string");
    let habits = loadList(STORE.habits)
      .filter((h) => h && typeof h.title === "string")
      .map((h) => ({
        id: h.id || makeId(),
        title: h.title,
        marks: h.marks && typeof h.marks === "object" && !Array.isArray(h.marks) ? h.marks : {}
      }));
    let prios = loadMap(STORE.prios);
    let notes = loadMap(STORE.notes);

    function getPrios(date) {
      const row = prios[date];
      return Array.isArray(row)
        ? row.filter((s) => typeof s === "string" && s.trim() !== "").slice(0, 3)
        : [];
    }

    function setPrios(date, list) {
      const clean = list.map((s) => s.trim()).filter(Boolean).slice(0, 3);
      if (clean.length) prios[date] = clean;
      else delete prios[date];
      save(STORE.prios, prios);
    }

    function parseTaskInput(value) {
      const text = value.trim();
      const match = text.match(/^([01]?\d|2[0-3])[\s:.;\-]+([0-5]\d)\s+(.+)$/);
      if (!match) return { title: text, time: "" };
      return {
        title: match[3].trim(),
        time: `${match[1].padStart(2, "0")}:${match[2]}`
      };
    }

    function taskOrderValue(task, index = 0) {
      return Number.isFinite(task.order) ? task.order : index;
    }

    function sortedTasksForDate(date) {
      return tasks
        .map((task, index) => ({ task, index }))
        .filter((item) => item.task.date === date)
        .sort((a, b) => {
          // перенесённые задачи всегда идут первыми
          const aMoved = (Number(a.task.movedCount) || 0) > 0 ? 0 : 1;
          const bMoved = (Number(b.task.movedCount) || 0) > 0 ? 0 : 1;
          if (aMoved !== bMoved) return aMoved - bMoved;
          const aTime = a.task.time || "99:99";
          const bTime = b.task.time || "99:99";
          return aTime.localeCompare(bTime) || taskOrderValue(a.task, a.index) - taskOrderValue(b.task, b.index);
        })
        .map((item) => item.task);
    }

    function nextTaskOrder(date) {
      const list = sortedTasksForDate(date);
      return list.length ? Math.max(...list.map((task, index) => taskOrderValue(task, index))) + 1 : 0;
    }

    function addTask(date, rawTitle) {
      const parsed = parseTaskInput(rawTitle);
      if (!parsed.title) return false;
      tasks.push({
        id: makeId(),
        date,
        originalDate: date,
        title: parsed.title,
        time: parsed.time,
        order: nextTaskOrder(date),
        movedCount: 0,
        done: false
      });
      saveAndRender();
      return true;
    }

    function updateTask(taskId, patch) {
      tasks = tasks.map((task) => task.id === taskId ? { ...task, ...patch } : task);
      saveAndRender();
    }

    function deleteTask(taskId) {
      tasks = tasks.filter((task) => task.id !== taskId);
      saveAndRender();
    }

    function reorderTasks(date, orderedIds) {
      const orderMap = new Map(orderedIds.map((id, index) => [id, index]));
      tasks = tasks.map((task) => task.date === date && orderMap.has(task.id)
        ? { ...task, order: orderMap.get(task.id) }
        : task
      );
    }

    // Аккуратное всплывающее подтверждение в стиле приложения (вместо нативного confirm)
    function showConfirm({ anchor, message, actions }) {
      return new Promise((resolve) => {
        const layer = document.createElement("div");
        layer.className = "confirm-layer";
        const pop = document.createElement("div");
        pop.className = "confirm-pop";
        pop.setAttribute("role", "dialog");
        pop.setAttribute("aria-modal", "true");

        const msg = document.createElement("p");
        msg.className = "confirm-msg";
        msg.textContent = message;

        const row = document.createElement("div");
        row.className = "confirm-actions";

        let settled = false;
        const finish = (value) => {
          if (settled) return;
          settled = true;
          document.removeEventListener("keydown", onKey, true);
          layer.remove();
          pop.remove();
          resolve(value);
        };

        actions.forEach((action) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "confirm-btn" + (action.kind ? " " + action.kind : "");
          btn.textContent = action.label;
          btn.addEventListener("click", () => finish(action.value));
          row.append(btn);
        });

        pop.append(msg, row);
        layer.addEventListener("pointerdown", () => finish(null));
        document.body.append(layer, pop);

        const rect = pop.getBoundingClientRect();
        const margin = 12;
        let top;
        let left;
        if (anchor && anchor.getBoundingClientRect) {
          const ar = anchor.getBoundingClientRect();
          top = ar.top + Math.min(ar.height / 2, 40);
          left = ar.left + ar.width / 2 - rect.width / 2;
        } else {
          top = window.innerHeight / 2 - rect.height / 2;
          left = window.innerWidth / 2 - rect.width / 2;
        }
        left = Math.max(margin, Math.min(left, window.innerWidth - rect.width - margin));
        top = Math.max(margin, Math.min(top, window.innerHeight - rect.height - margin));
        pop.style.top = `${top}px`;
        pop.style.left = `${left}px`;

        const onKey = (event) => {
          if (event.key === "Escape") {
            event.stopPropagation();
            finish(null);
          }
        };
        document.addEventListener("keydown", onKey, true);
        const firstBtn = row.querySelector("button");
        if (firstBtn) firstBtn.focus();
      });
    }

    function askActuality(task, count, anchor) {
      return showConfirm({
        anchor,
        message: `«${task.title}» переносится уже ${count}-й раз. Задача ещё актуальна?`,
        actions: [
          { label: "Да, перенести", kind: "primary", value: "move" },
          { label: "Нет, удалить", kind: "danger", value: "delete" }
        ]
      });
    }

    async function moveTask(taskId, targetDate, beforeId = "", anchor = null) {
      const moving = tasks.find((task) => task.id === taskId);
      if (!moving) return;
      const isDateChange = moving.date !== targetDate;
      const nextMovedCount = (Number(moving.movedCount) || 0) + (isDateChange ? 1 : 0);

      if (isDateChange && nextMovedCount >= 2) {
        const choice = await askActuality(moving, nextMovedCount, anchor);
        if (choice === "delete") {
          deleteTask(taskId);
          return;
        }
        if (choice !== "move") return;
      }

      tasks = tasks.map((task) => task.id === taskId ? {
        ...task,
        date: targetDate,
        originalDate: task.originalDate || task.date,
        movedCount: nextMovedCount
      } : task);
      const targetIds = sortedTasksForDate(targetDate)
        .filter((task) => task.id !== taskId)
        .map((task) => task.id);
      const insertAt = beforeId ? targetIds.indexOf(beforeId) : -1;
      targetIds.splice(insertAt >= 0 ? insertAt : targetIds.length, 0, taskId);
      reorderTasks(targetDate, targetIds);
      saveAndRender();
    }

    function movePriority(sourceDate, sourceIndex, targetDate, beforeIndex = -1) {
      const source = getPrios(sourceDate);
      const [item] = source.splice(sourceIndex, 1);
      if (!item) return;

      const target = sourceDate === targetDate ? source : getPrios(targetDate);
      const adjustedBefore = sourceDate === targetDate && beforeIndex > sourceIndex ? beforeIndex - 1 : beforeIndex;
      const insertAt = adjustedBefore >= 0 ? Math.min(adjustedBefore, target.length) : Math.min(target.length, 2);
      target.splice(insertAt, 0, item);
      setPrios(sourceDate, source);
      setPrios(targetDate, target.slice(0, 3));
      render();
    }

    function dayStats(date) {
      const current = tasks.filter((task) => task.date === date);
      const outbound = tasks.filter((task) => (task.originalDate || task.date) === date && task.date !== date);
      const debt = outbound.filter((task) => !task.done);
      const done = current.filter((task) => task.done).length + outbound.filter((task) => task.done).length;
      const total = current.length + outbound.length;
      return {
        current,
        outbound,
        debt,
        done,
        total,
        pct: total === 0 ? 0 : Math.round((done / total) * 100)
      };
    }

    function beforeTaskIdFromPoint(container, y) {
      const items = [...container.querySelectorAll(".task:not(.dragging)")];
      const next = items.find((item) => y < item.getBoundingClientRect().top + item.getBoundingClientRect().height / 2);
      return next ? next.dataset.taskId : "";
    }

    function beforePriorityIndexFromPoint(container, x, y) {
      const items = [...container.querySelectorAll(".chip:not(.dragging)")];
      const next = items.find((item) => {
        const rect = item.getBoundingClientRect();
        return y < rect.top + rect.height / 2 || (y <= rect.bottom && x < rect.left + rect.width / 2);
      });
      return next ? Number(next.dataset.prioIndex) : -1;
    }

    // Единый drag-and-drop на Pointer Events: мышь тянет сразу по порогу сдвига,
    // тач — после короткого удержания (иначе конфликтует со скроллом страницы).
    function manualScroll(el, dy) {
      if (!dy) return;
      const scrollHost = el ? el.closest(".tasks") : null;
      if (scrollHost) {
        const before = scrollHost.scrollTop;
        scrollHost.scrollTop += dy;
        dy -= scrollHost.scrollTop - before;
      }
      if (Math.abs(dy) > 0.5) {
        document.scrollingElement.scrollTop += dy;
      }
    }

    function attachPointerDrag(el, { dropSelector, computeInsertion, onDrop, onDragChange }) {
      el.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        const interactive = event.target.closest("button, input, textarea, select");
        if (interactive && interactive !== el) return;

        const pointerId = event.pointerId;
        const isTouch = event.pointerType !== "mouse";
        const startX = event.clientX;
        const startY = event.clientY;
        let dragging = false;
        let ghost = null;
        let currentTarget = null;
        let holdTimer = null;
        let lastX = startX;
        let lastY = startY;

        function beginDrag(x, y) {
          dragging = true;
          onDragChange(true);
          el.classList.add("dragging");
          document.body.classList.add("dnd-active");
          const rect = el.getBoundingClientRect();
          ghost = el.cloneNode(true);
          ghost.classList.add("drag-ghost");
          ghost.style.width = `${rect.width}px`;
          ghost.style.left = `${rect.left}px`;
          ghost.style.top = `${rect.top}px`;
          ghost.dataset.dx = String(x - rect.left);
          ghost.dataset.dy = String(y - rect.top);
          document.body.append(ghost);
        }

        function updateTarget(x, y) {
          const hit = document.elementFromPoint(x, y);
          const container = hit ? hit.closest(dropSelector) : null;
          if (container !== currentTarget) {
            if (currentTarget) currentTarget.classList.remove("drag-over");
            currentTarget = container;
            if (currentTarget) currentTarget.classList.add("drag-over");
          }
        }

        function onMove(moveEvent) {
          if (moveEvent.pointerId !== pointerId) return;
          const x = moveEvent.clientX;
          const y = moveEvent.clientY;

          if (!dragging) {
            const dist = Math.hypot(x - startX, y - startY);
            if (!isTouch) {
              if (dist > 4) beginDrag(x, y);
              else return;
            } else {
              if (holdTimer && dist > 10) {
                clearTimeout(holdTimer);
                holdTimer = null;
              }
              manualScroll(el, lastY - y);
              lastX = x;
              lastY = y;
              return;
            }
          }

          moveEvent.preventDefault();
          if (ghost) {
            ghost.style.left = `${x - Number(ghost.dataset.dx)}px`;
            ghost.style.top = `${y - Number(ghost.dataset.dy)}px`;
          }
          updateTarget(x, y);
          lastX = x;
          lastY = y;
        }

        function finish(dropped) {
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onCancel);
          if (holdTimer) clearTimeout(holdTimer);
          if (dragging) {
            el.classList.remove("dragging");
            document.body.classList.remove("dnd-active");
            if (currentTarget) currentTarget.classList.remove("drag-over");
            if (ghost) ghost.remove();
            onDragChange(false);
            if (dropped && currentTarget) {
              onDrop(currentTarget, computeInsertion(currentTarget, lastX, lastY));
            }
          }
          dragging = false;
          ghost = null;
          currentTarget = null;
        }

        function onUp(upEvent) {
          if (upEvent.pointerId !== pointerId) return;
          finish(true);
        }

        function onCancel(cancelEvent) {
          if (cancelEvent.pointerId !== pointerId) return;
          finish(false);
        }

        if (isTouch) {
          holdTimer = setTimeout(() => {
            holdTimer = null;
            beginDrag(lastX, lastY);
          }, 320);
        }

        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onCancel);
      });
    }

    // ── обработчики ─────────────────────────────────────────────────────

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = taskInput.value.trim();

      if (!title) {
        taskInput.focus();
        return;
      }

      if (addTask(daySelect.value, title)) {
        taskInput.value = "";
        taskInput.focus();
      }
    });

    habitForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = habitInput.value.trim();

      if (!title) {
        habitInput.focus();
        return;
      }

      habits.push({ id: makeId(), title, marks: {} });
      habitInput.value = "";
      habitInput.focus();
      save(STORE.habits, habits);
      renderHabits();
    });

    clearDoneBtn.addEventListener("click", () => {
      const dates = weekDates();
      const doneCount = tasks.filter((t) => t.done && dates.includes(t.date)).length;
      if (doneCount === 0) return;
      if (!confirm(`Удалить выполненные задачи этой недели (${doneCount})?`)) return;
      tasks = tasks.filter((t) => !(t.done && dates.includes(t.date)));
      saveAndRender();
    });

    clearWeekBtn.addEventListener("click", () => {
      const dates = weekDates();
      const weekNotes = notes[weekStart];
      const hasAnything = tasks.some((t) => dates.includes(t.date))
        || habits.some((h) => dates.some((date) => h.marks[date]))
        || dates.some((date) => getPrios(date).length > 0)
        || Boolean(weekNotes && Object.values(weekNotes).some((text) => text));
      if (!hasAnything) return;
      if (!confirm("Очистить эту неделю? Удалятся её задачи, приоритеты, отметки привычек и итоги. Сами привычки останутся.")) return;
      tasks = tasks.filter((t) => !dates.includes(t.date));
      habits.forEach((h) => dates.forEach((date) => { delete h.marks[date]; }));
      dates.forEach((date) => { delete prios[date]; });
      delete notes[weekStart];
      save(STORE.tasks, tasks);
      save(STORE.habits, habits);
      save(STORE.prios, prios);
      save(STORE.notes, notes);
      syncWeek();
    });

    prevWeekBtn.addEventListener("click", () => {
      weekStart = addDays(weekStart, -7);
      syncWeek();
    });

    nextWeekBtn.addEventListener("click", () => {
      weekStart = addDays(weekStart, 7);
      syncWeek();
    });

    todayBtn.addEventListener("click", () => {
      weekStart = mondayISO(new Date());
      syncWeek();
    });

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
    });

    applyTheme(document.documentElement.dataset.theme || localStorage.getItem(themeKey) || "light");
    dailyQuote.textContent = dayQuotes[(new Date().getDay() + 6) % 7];

    noteFields.forEach((field) => {
      field.addEventListener("input", () => {
        const current = notes[weekStart] && typeof notes[weekStart] === "object" ? notes[weekStart] : {};
        current[field.dataset.note] = field.value;
        notes[weekStart] = current;
        save(STORE.notes, notes);
      });
    });

    focusForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!focusDate) return;
      const title = focusInput.value.trim();
      if (!title) {
        focusInput.focus();
        return;
      }
      if (addTask(focusDate, title)) {
        focusInput.value = "";
        renderFocus();
        focusInput.focus();
      }
    });

    focusDayBtn.addEventListener("click", () => {
      const todayIso = toISO(new Date());
      if (weekStart !== mondayISO(new Date())) {
        weekStart = mondayISO(new Date());
        syncWeek();
      }
      openFocus(todayIso);
    });

    focusClose.addEventListener("click", closeFocus);
    focusModal.addEventListener("click", (event) => {
      if (event.target === focusModal) closeFocus();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !focusModal.hidden) closeFocus();
    });

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeToggle.textContent = theme === "dark" ? "☀️ Светлая тема" : "🌙 Тёмная тема";
      try {
        localStorage.setItem(themeKey, theme);
      } catch {}
    }

    async function moveIncomplete(date, anchor) {
      const next = addDays(date, 1);
      const candidates = sortedTasksForDate(date).filter((t) => !t.done);
      for (const t of candidates) {
        const movedCount = (Number(t.movedCount) || 0) + 1;
        if (movedCount >= 2) {
          const choice = await askActuality(t, movedCount, anchor);
          if (choice === "delete") {
            tasks = tasks.filter((x) => x.id !== t.id);
            continue;
          }
          if (choice !== "move") continue;
        }
        const order = nextTaskOrder(next);
        tasks = tasks.map((x) => x.id === t.id ? {
          ...x,
          date: next,
          originalDate: x.originalDate || x.date,
          movedCount,
          order
        } : x);
      }
      saveAndRender();
    }

    function saveAndRender() {
      save(STORE.tasks, tasks);
      render();
      renderFocus();
    }

    // ── отрисовка ───────────────────────────────────────────────────────

    function buildDaySelect() {
      const previous = daySelect.value;
      daySelect.replaceChildren();
      const dates = selectableDates();
      for (let weekOffset = 0; weekOffset < 5; weekOffset++) {
        const group = document.createElement("optgroup");
        group.label = weekOffset === 0 ? "Эта неделя" : weekOffset === 1 ? "Следующая неделя" : `Через ${weekOffset} недели`;
        dates.slice(weekOffset * 7, weekOffset * 7 + 7).forEach((date, index) => {
          const option = document.createElement("option");
          option.value = date;
          option.textContent = `${dayNames[index]}, ${fmtShort(date)}`;
          group.append(option);
        });
        daySelect.append(group);
      }
      const available = dates.includes(previous);
      if (available) {
        daySelect.value = previous;
        return;
      }
      const todayIso = toISO(new Date());
      if (dates.includes(todayIso)) {
        daySelect.value = todayIso;
        return;
      }
      daySelect.value = dates[0];
    }

    function syncWeek() {
      const endIso = addDays(weekStart, 6);
      const thisYear = new Date().getFullYear();
      const withYear = fromISO(weekStart).getFullYear() !== thisYear || fromISO(endIso).getFullYear() !== thisYear;
      weekRange.textContent = `${fmtLong(weekStart)} — ${fmtLong(endIso, withYear)}`;
      todayBtn.hidden = weekStart === mondayISO(new Date());
      buildDaySelect();
      noteFields.forEach((field) => {
        const weekNotes = notes[weekStart];
        const value = weekNotes && typeof weekNotes[field.dataset.note] === "string" ? weekNotes[field.dataset.note] : "";
        field.value = value;
      });
      render();
      renderHabits();
    }

    function dayIndexFromDate(date) {
      return (fromISO(date).getDay() + 6) % 7;
    }

    function openFocus(date) {
      focusDate = date;
      focusModal.hidden = false;
      document.body.classList.add("modal-open");
      renderFocus();
      focusInput.focus();
    }

    function closeFocus() {
      focusDate = "";
      focusModal.hidden = true;
      document.body.classList.remove("modal-open");
    }

    function renderFocus() {
      if (!focusDate || focusModal.hidden) return;
      const index = dayIndexFromDate(focusDate);
      const dayTasks = sortedTasksForDate(focusDate);
      const stats = dayStats(focusDate);
      focusTitle.textContent = `Фокус дня: ${dayNames[index]}`;
      focusSubtitle.textContent = `${fmtShort(focusDate)} · выполнено ${stats.done} из ${stats.total}`;
      focusList.replaceChildren();

      if (dayTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Свободный день";
        focusList.append(empty);
        return;
      }

      dayTasks.forEach((task) => {
        const row = document.createElement("article");
        row.className = `focus-task${task.done ? " done" : ""}${task.movedCount ? " moved" : ""}`;

        const edit = document.createElement("input");
        edit.type = "text";
        edit.className = "focus-edit";
        edit.maxLength = 120;
        edit.value = task.time ? `${task.time} ${task.title}` : task.title;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.title = "Удалить задачу";
        remove.setAttribute("aria-label", "Удалить задачу");
        remove.textContent = "×";

        row.addEventListener("click", (event) => {
          if (event.target.closest("input, button")) return;
          updateTask(task.id, { done: !task.done });
          renderFocus();
        });

        const commitEdit = () => {
          const parsed = parseTaskInput(edit.value);
          if (!parsed.title) {
            edit.value = task.time ? `${task.time} ${task.title}` : task.title;
            return;
          }
          updateTask(task.id, { title: parsed.title, time: parsed.time });
          renderFocus();
        };
        edit.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            edit.blur();
          }
          if (event.key === "Escape") {
            edit.value = task.time ? `${task.time} ${task.title}` : task.title;
            edit.blur();
          }
        });
        edit.addEventListener("blur", commitEdit);

        remove.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteTask(task.id);
          renderFocus();
        });

        row.append(edit, remove);
        focusList.append(row);
      });
    }

    function renderPrios(container, date) {
      container.replaceChildren();
      container.dataset.date = date;
      const list = getPrios(date);

      const editor = (index) => {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "prio-edit";
        input.maxLength = 80;
        input.placeholder = "Приоритет";
        input.value = index < list.length ? list[index] : "";
        let committed = false;
        const commit = () => {
          if (committed) return;
          committed = true;
          const text = input.value.trim();
          const next = getPrios(date);
          if (index < next.length) {
            if (text) next[index] = text;
            else next.splice(index, 1);
          } else if (text) {
            next.push(text);
          }
          setPrios(date, next);
          render();
        };
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            commit();
          }
          if (event.key === "Escape") {
            committed = true;
            render();
          }
        });
        input.addEventListener("blur", commit);
        return input;
      };

      list.forEach((text, index) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.dataset.date = date;
        chip.dataset.prioIndex = String(index);
        chip.title = "Изменить приоритет";
        const num = document.createElement("b");
        num.textContent = String(index + 1);
        const label = document.createElement("span");
        label.textContent = text;
        chip.append(num, label);
        let chipDragged = false;
        chip.addEventListener("click", () => {
          if (chipDragged) return;
          const input = editor(index);
          chip.replaceWith(input);
          input.focus();
          input.select();
        });
        attachPointerDrag(chip, {
          dropSelector: ".prios",
          computeInsertion: (target, x, y) => beforePriorityIndexFromPoint(target, x, y),
          onDrop: (target, beforeIndex) => movePriority(date, index, target.dataset.date, beforeIndex),
          onDragChange: (isDragging) => {
            chipDragged = isDragging || chipDragged;
            if (!isDragging) setTimeout(() => { chipDragged = false; }, 0);
          }
        });
        container.append(chip);
      });

      if (list.length < 3) {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "add-prio";
        add.textContent = "+ приоритет";
        add.addEventListener("click", () => {
          const picker = document.createElement("div");
          picker.className = "prio-picker";
          const taskList = document.createElement("div");
          taskList.className = "prio-picker-list";
          const dayTasks = sortedTasksForDate(date).filter((task) => !list.includes(task.title));
          const available = 3 - list.length;

          if (dayTasks.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "В этом дне нет задач для приоритета";
            taskList.append(empty);
          } else {
            dayTasks.forEach((task) => {
              const label = document.createElement("label");
              label.className = "prio-option";
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.value = task.title;
              const text = document.createElement("span");
              text.textContent = task.time ? `${task.time} ${task.title}` : task.title;
              label.append(checkbox, text);
              taskList.append(label);
            });
          }

          const actions = document.createElement("div");
          actions.className = "prio-picker-actions";
          const cancel = document.createElement("button");
          cancel.type = "button";
          cancel.className = "mini-btn";
          cancel.textContent = "Отмена";
          const apply = document.createElement("button");
          apply.type = "button";
          apply.className = "mini-btn primary";
          apply.textContent = "Выбрать";
          actions.append(cancel, apply);
          picker.append(taskList, actions);

          picker.addEventListener("change", () => {
            const selected = [...picker.querySelectorAll("input:checked")];
            if (selected.length <= available) return;
            selected[selected.length - 1].checked = false;
          });
          cancel.addEventListener("click", () => render());
          apply.addEventListener("click", () => {
            const selected = [...picker.querySelectorAll("input:checked")].map((input) => input.value);
            if (selected.length) setPrios(date, [...list, ...selected]);
            render();
          });

          add.replaceWith(picker);
        });
        container.append(add);
      }
    }

    function render() {
      week.replaceChildren();
      const todayIso = toISO(new Date());

      weekDates().forEach((date, index) => {
        const dayTasks = sortedTasksForDate(date);
        const pending = dayTasks.filter((t) => !t.done).length;

        const section = document.createElement("section");
        section.className = date === todayIso ? "day today" : "day";
        section.dataset.date = date;
        section.innerHTML = `
          <div class="day-head">
            <h2 class="day-title">
              <span class="day-name">${dayNames[index]}</span>
              <span class="day-date">${fmtShort(date)}</span>
            </h2>
            <div class="day-tools">
              ${pending > 0 ? `
                <button class="move" type="button" title="Перенести невыполненное на завтра" aria-label="Перенести невыполненное на завтра">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14"></path>
                    <path d="M13 6l6 6-6 6"></path>
                  </svg>
                </button>
              ` : ""}
            </div>
          </div>
          <div class="prios"></div>
          <div class="tasks"></div>
          <div class="quick-add-slot"></div>
        `;

        const moveButton = section.querySelector(".move");
        if (moveButton) {
          moveButton.addEventListener("click", () => moveIncomplete(date, section));
        }
        renderPrios(section.querySelector(".prios"), date);

        const list = section.querySelector(".tasks");
        list.dataset.date = date;

        if (dayTasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Свободный день";
          list.append(empty);
        } else {
          dayTasks.forEach((task) => list.append(createTask(task)));
        }

        section.addEventListener("click", (event) => {
          if (event.target.closest("button, input, textarea, select, label, .task, .chip, .add-prio")) return;
          if (section.querySelector(".quick-add")) return;

          const input = document.createElement("input");
          input.type = "text";
          input.className = "quick-add";
          input.maxLength = 120;
          input.autocomplete = "off";
          input.placeholder = "Новая задача";

          let committed = false;
          const close = (saveTask) => {
            if (committed) return;
            committed = true;
            const value = input.value.trim();
            if (saveTask && value) addTask(date, value);
            else input.closest(".quick-add-slot").replaceChildren();
          };

          input.addEventListener("keydown", (keyEvent) => {
            if (keyEvent.key === "Enter") {
              keyEvent.preventDefault();
              close(true);
            }
            if (keyEvent.key === "Escape") {
              keyEvent.preventDefault();
              close(false);
            }
          });
          input.addEventListener("blur", () => close(Boolean(input.value.trim())));
          section.querySelector(".quick-add-slot").append(input);
          input.focus();
        });

        week.append(section);
      });

      renderProgress();
      renderChart();
    }

    function renderChart() {
      const todayIso = toISO(new Date());
      const perDay = weekDates().map((date) => dayStats(date));
      const max = Math.max(1, ...perDay.map((d) => d.total));

      chartBars.replaceChildren();
      chartDays.replaceChildren();

      perDay.forEach((day, index) => {
        const date = weekDates()[index];
        const slot = document.createElement("div");
        slot.className = day.debt.length ? "chart-slot has-debt" : "chart-slot";
        slot.title = `${dayNames[index]}, ${fmtShort(date)}: выполнено ${day.done} из ${day.total}${day.debt.length ? `, актуальных переносов из этого дня: ${day.debt.length}` : ""}`;

        const value = document.createElement("span");
        value.className = "chart-value";
        value.textContent = day.total > 0 ? `${day.pct}%` : "";

        const track = document.createElement("div");
        track.className = "chart-track";
        track.style.height = `${(day.total / max) * 100}%`;

        const fill = document.createElement("div");
        fill.className = "chart-fill";
        fill.style.height = day.total > 0 ? `${(day.done / day.total) * 100}%` : "0";

        track.append(fill);
        slot.append(value, track);
        chartBars.append(slot);

        const label = document.createElement("span");
        label.className = date === todayIso ? "chart-day today" : "chart-day";
        label.textContent = dayShort[index];
        chartDays.append(label);
      });
    }

    function renderHabits() {
      habitGrid.replaceChildren();
      const dates = weekDates();

      if (habits.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty habit-empty";
        empty.textContent = "Добавь привычки — например, «Вода», «Прогулка», «Чтение».";
        habitGrid.append(empty);
        return;
      }

      ["Привычка", ...dayShort, "Прогресс"].forEach((text, index) => {
        const cell = document.createElement("span");
        cell.className = index === 0 ? "habit-h habit-h-name" : "habit-h";
        cell.textContent = text;
        habitGrid.append(cell);
      });

      habits.forEach((habit) => {
        const name = document.createElement("div");
        name.className = "habit-name";
        const title = document.createElement("span");
        title.textContent = habit.title;
        title.title = habit.title;
        const del = document.createElement("button");
        del.type = "button";
        del.className = "habit-del";
        del.textContent = "✕";
        del.title = "Удалить привычку";
        del.setAttribute("aria-label", `Удалить привычку «${habit.title}»`);
        del.addEventListener("click", async () => {
          const choice = await showConfirm({
            anchor: name,
            message: `Удалить привычку «${habit.title}»? Отметки за неделю тоже сотрутся.`,
            actions: [
              { label: "Удалить", kind: "danger", value: "delete" },
              { label: "Отмена", value: null }
            ]
          });
          if (choice !== "delete") return;
          habits = habits.filter((item) => item.id !== habit.id);
          save(STORE.habits, habits);
          renderHabits();
        });
        name.append(title, del);
        habitGrid.append(name);

        const fill = document.createElement("i");
        const pctLabel = document.createElement("span");

        const updateProgress = () => {
          const doneCount = dates.filter((date) => habit.marks[date]).length;
          const pct = Math.round((doneCount / 7) * 100);
          fill.style.width = `${pct}%`;
          pctLabel.textContent = `${pct}%`;
        };

        dates.forEach((date, dayIndex) => {
          const box = document.createElement("label");
          box.className = "hcheck";
          box.title = `${habit.title} — ${dayNames[dayIndex]}, ${fmtShort(date)}`;
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(habit.marks[date]);
          input.setAttribute("aria-label", `${habit.title} — ${dayNames[dayIndex]}, ${fmtShort(date)}`);
          input.addEventListener("change", () => {
            if (input.checked) habit.marks[date] = true;
            else delete habit.marks[date];
            save(STORE.habits, habits);
            updateProgress();
          });
          box.append(input);
          box.insertAdjacentHTML(
            "beforeend",
            '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.2 4.1L19 7"></path></svg>'
          );
          habitGrid.append(box);
        });

        const progress = document.createElement("div");
        progress.className = "habit-progress";
        const meter = document.createElement("div");
        meter.className = "habit-meter";
        meter.append(fill);
        pctLabel.className = "habit-pct";
        updateProgress();
        progress.append(meter, pctLabel);
        habitGrid.append(progress);
      });
    }

    function startTaskEdit(node, task) {
      if (node.querySelector(".task-edit")) return;
      const body = node.querySelector(".task-body");
      const input = document.createElement("input");
      input.type = "text";
      input.className = "task-edit";
      input.maxLength = 120;
      input.autocomplete = "off";
      input.value = task.time ? `${task.time} ${task.title}` : task.title;

      let committed = false;
      const commit = (saveIt) => {
        if (committed) return;
        committed = true;
        if (saveIt) {
          const parsed = parseTaskInput(input.value);
          if (parsed.title) {
            updateTask(task.id, { title: parsed.title, time: parsed.time });
            return;
          }
        }
        render();
      };

      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          commit(true);
        }
        if (event.key === "Escape") {
          event.preventDefault();
          commit(false);
        }
      });
      input.addEventListener("blur", () => commit(true));

      body.replaceWith(input);
      input.focus();
      input.select();
    }

    function createTask(task) {
      const node = template.content.firstElementChild.cloneNode(true);
      const text = node.querySelector(".text");
      const time = node.querySelector(".task-time");
      const editButton = node.querySelector(".edit-task");
      const removeButton = node.querySelector(".delete");

      node.dataset.taskId = task.id;
      node.classList.toggle("done", task.done);
      node.classList.toggle("moved", (Number(task.movedCount) || 0) > 0);
      text.textContent = task.title;
      time.hidden = !task.time;
      time.textContent = task.time || "";
      let wasDragged = false;

      attachPointerDrag(node, {
        dropSelector: ".tasks",
        computeInsertion: (target, x, y) => beforeTaskIdFromPoint(target, y),
        onDrop: (target, beforeId) => moveTask(task.id, target.dataset.date, beforeId, target),
        onDragChange: (isDragging) => {
          wasDragged = isDragging || wasDragged;
          if (!isDragging) setTimeout(() => { wasDragged = false; }, 0);
        }
      });

      node.addEventListener("click", () => {
        if (wasDragged) return;
        if (node.querySelector(".task-edit")) return;
        updateTask(task.id, { done: !task.done });
      });

      editButton.addEventListener("click", (event) => {
        event.stopPropagation();
        startTaskEdit(node, task);
      });

      removeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        deleteTask(task.id);
      });

      return node;
    }

    function renderProgress() {
      const dates = weekDates();
      const stats = dates.map((date) => dayStats(date));
      const total = stats.reduce((sum, day) => sum + day.total, 0);
      const done = stats.reduce((sum, day) => sum + day.done, 0);
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);

      progressRing.style.setProperty("--p", pct);
      ringPct.textContent = `${pct}%`;
      ringCaption.textContent = total === 0 ? "Пока нет задач" : `${done} из ${total} выполнено`;
    }

    syncWeek();
  </script>
</body>
</html>
